[project]
name = "mem-forensics-mcp-server"
version = "0.2.0"
description = "Memory Forensics MCP Server - Two-tier engine (Rust + Volatility3)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Your Name" }
]
keywords = ["mcp", "forensics", "volatility", "memory", "dfir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "mcp>=1.12.4,<2",
    "pefile>=2024.8.26",
    "python-dotenv>=1.2.1",
    "volatility3==2.28.0",
    "yara-python>=4.5.1,<5",
    "yara-x>=0.10.0,<1",
]

[project.optional-dependencies]
volatility3 = [
    "capstone>=5.0.3,<6",
    "pycryptodome>=3.21.0,<4",
]

[project.urls]
Repository = "https://github.com/yourusername/mem-forensics-mcp-server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mem_forensics_mcp_server"]

[tool.hatch.build]
exclude = [
    "mem_forensics_mcp_server/engine/memoxide-src/target/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
